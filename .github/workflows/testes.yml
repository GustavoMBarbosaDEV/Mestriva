name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ferramentas/package-lock.json
      - name: Ferramentas
        working-directory: ferramentas
        run: npm ci
      - name: Testes automáticos (inclui as 450 questões do banco)
        run: node --test "testes/*.test.mjs"
      - name: Build de publicação (confere CSS em dia e versões)
        working-directory: ferramentas
        run: node build.mjs

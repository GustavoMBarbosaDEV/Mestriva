version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependências"
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/ferramentas"
    schedule:
      interval: weekly
    commit-message:
      prefix: "Dependências"
    groups:
      fontes:
        patterns: ["@fontsource/*"]

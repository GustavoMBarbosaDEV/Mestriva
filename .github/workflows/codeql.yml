name: CodeQL

on:
  push:
    branches: [main, testes]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
          # Bibliotecas de terceiros copiadas e minificadas: não são código nosso.
          config: |
            paths-ignore:
              - vendor
              - dist
              - ferramentas/node_modules
      # Envia o resultado para a aba Security e guarda uma cópia aqui: o passo seguinte falha se houver qualquer alerta.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
          output: resultados
      - name: Falhar se o CodeQL achou algum problema
        run: |
          set -euo pipefail
          total=$(jq -s '[.[].runs[].results[]] | length' resultados/*.sarif)
          jq -r '.runs[].results[] | "- " + .ruleId + " em " + .locations[0].physicalLocation.artifactLocation.uri + ":" + (.locations[0].physicalLocation.region.startLine | tostring) + " — " + .message.text' resultados/*.sarif
          if [ "$total" -gt 0 ]; then echo "::error::O CodeQL achou $total problema(s), listados acima."; exit 1; fi
          echo "Nenhum problema encontrado."
